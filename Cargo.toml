[package]
name = "jikanda"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.92"
publish = false
description = "A calm, local-first native desktop focus companion"
license = "GPL-3.0-only"
repository = "https://github.com/yuprananda/jikanda"
homepage = "https://github.com/yuprananda/jikanda"

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "accessibility", "compat-1-18", "raw-window-handle-06"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
notify-rust = "4.18"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_Media_Audio"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
strip = true

